syntax = "proto3";

package user;
option go_package = "./internal/proto";

service UserService {
  rpc GetUser (GetUserRequest) returns (GetUserResponse);
}

message GetUserRequest {
  string id = 1;
}

message GetUserResponse {
  string id = 1;
  string name = 2;
  int32 age = 3;
  int32 number = 4;
  string status = 5;
}